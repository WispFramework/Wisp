name: Build & Push NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check NuGet API key
        run: |
          test -n "${{ secrets.NUGET_API_KEY }}" || (echo "Missing NUGET_API_KEY" && exit 1)

      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x.x'
      
      - name: Restore
        run: dotnet restore
      
      - name: Build
        run: |
          dotnet build "Wisp.Framework/Wisp.Framework.csproj" \
            -c Release \
            -p:Version=${GITHUB_REF_NAME#v}
      
      - name: Pack
        run: |
          dotnet pack "Wisp.Framework/Wisp.Framework.csproj" \
            -c Release \
            -p:PackageVersion=${GITHUB_REF_NAME#v} \
            -p:IncludeSymbols=true \
            -p:SymbolPackageFormat=snupkg \
            -o ./artifacts
      
      - name: Push NuGet Packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push NuGet Symbols
          run: |
            dotnet nuget push "./artifacts/*.snupkg" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate

      - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ github.ref_name }}
            name: ${{ github.ref_name }}
            files: |
              artifacts/*.nupkg
              artifacts/*.snupkg
            generate_release_notes: true